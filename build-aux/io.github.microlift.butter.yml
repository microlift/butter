# Butter compiles Rosemary at runtime, inside the sandbox, so the runners it
# builds link against the same libraries they later run with. That needs a
# C toolchain and headers at runtime too. To make this work in Flatpak,
# we use a development runtime like GNOME builder.
app-id: io.github.microlift.butter
runtime: org.gnome.Sdk
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: butter

# Optional features that need more, such as Rosemary's Steam bridge or
# shared memory on old X11 setups, are offered when Butter first starts: it
# shows the `flatpak override` command that grants them. See permissions.rs.
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Discord's IPC socket, for roserpc's Rich Presence: the native client's,
  # and where the Flatpak Discord and Vesktop put theirs.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=xdg-run/app/dev.vencord.Vesktop:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

cleanup:
  - /share/doc
  - /share/man

modules:
  # VTE draws the terminals of the Process Manager. Only its GTK 4 library
  # is needed.
  - name: vte
    buildsystem: meson
    config-opts:
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dgir=false
      - -Dvapi=false
      - -Ddocs=false
      - -Dglade=false
      - -Dapp=false
      - -D_systemd=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.84/vte-0.84.1.tar.xz
        sha256: aca1caa8478aebcdbb1d67897fb3511eb7601debae6810e16a15b6fa25f31ac8

  # roserpc shows the Roblox game being played on Discord. The Roblox plugin
  # starts it; it is plain Python, run by the runtime's python3.
  - name: roserpc
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/roserpc /app/bin
      - cp -r roserpc /app/share/roserpc/
      - install -Dm644 LICENSE /app/share/licenses/roserpc/LICENSE
      - printf '#!/bin/sh\nPYTHONPATH=/app/share/roserpc exec python3 -m roserpc "$@"\n' > /app/bin/roserpc
      - chmod 755 /app/bin/roserpc
    sources:
      - type: git
        url: https://github.com/st1rynight/roserpc.git
        commit: 488a6506d81937188320ade5781ebd5c36e944f3

  - name: butter
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/butter/cargo
      # Fetches crates while building.
      # TODO: Use flatpak-cargo-generator for offline builds
      build-args:
        - --share=network
    build-commands:
      # vte4-sys finds VTE through pkg-config. Point it at wherever the vte
      # module put its .pc file, and say so if it is not there at all.
      - |
        pc=$(find /app -name vte-2.91-gtk4.pc | head -n 1)
        if [ -z "$pc" ]; then
          echo "vte-2.91-gtk4.pc was not installed by the vte module; /app/lib holds:"
          ls -R /app/lib | head -n 60
          exit 1
        fi
        export PKG_CONFIG_PATH="$(dirname "$pc"):$PKG_CONFIG_PATH"
        # The vte module may install into /app/lib64, which is not on the
        # loader's default search path in the sandbox. Bake both locations
        # into the binary's RPATH so libvte-2.91-gtk4 is always found.
        export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-rpath,/app/lib64 -C link-arg=-Wl,-rpath,/app/lib"
        cargo build --release --locked
      - make install PREFIX=/app
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - build-dir
          - .flatpak-builder

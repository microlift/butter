[package]
name = "butter"
version = "1.2.1"
edition = "2024"
rust-version = "1.88"
description = "Manage Rosemary runners and prefixes"
license = "GPL-3.0-or-later"
repository = "https://github.com/microlift/butter"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
anyhow = "1"
async-channel = "2"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tar = "0.4"
zstd = "0.13"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
libc = "0.2.190"
vte4 = "0.10"
sha2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
plist = { version = "1", default-features = false }
which = "8.0.6"

[profile.release]
lto = "thin"
